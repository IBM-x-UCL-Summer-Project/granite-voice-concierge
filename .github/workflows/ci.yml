name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    # Dependency setup should complete in minutes. Fail visibly instead of
    # occupying a runner for GitHub's multi-hour default timeout.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2,<3"

      - name: Install Python dependencies
        run: |
          # Preinstalled CPU PyTorch satisfies the project dependency and
          # prevents pip from downloading several gigabytes of CUDA wheels.
          python -m pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          python -m ruff check .

      - name: Run formatting check
        run: |
          python -m black --check .

      - name: Run test suite with coverage
        run: |
          python -m pytest --cov=voice_concierge --cov-report=term-missing --cov-branch
