[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-voice-concierge"
version = "0.1.0"
description = "Offline voice-first assistant prototype for independent living"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Reasoning and memory
    "httpx>=0.27,<1",
    "ollama>=0.6.2,<0.7",
    "pydantic>=2.9,<3",
    "pysqlite3>=0.6,<1",
    "sqlite-vec>=0.1,<0.2",
    # Audio I/O
    "pyaudio>=0.2.11,<0.3",
    "sounddevice>=0.5,<0.6",
    # Wake word detection
    # Unpinned: no openwakeword release with a Python 3.12-installable
    # tflite-runtime exists, so let the resolver pick a compatible version.
    "openwakeword",
    # Specific onnxruntime as other versions resulting in nil wakeword score
    "onnxruntime>=1.20.1,<1.21",
    # Voice activity detection
    "silero-vad>=6,<7",
    "torch>=2,<3",
    # Speech-to-text
    "faster-whisper>=1,<2",
    # Text-to-speech
    "piper-tts>=1,<2",
    # Utilities
    "numpy>=2,<3",
    "psutil>=5,<8",
]

[project.optional-dependencies]
dev = [
    "black>=26,<27",
    "ruff>=0.15,<1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voice_concierge.reasoning" = ["prompts/*/*.toml", "prompts/*/*.txt"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
]
filterwarnings = [
    "ignore:urllib3 v2 only supports OpenSSL:Warning",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == ['\"]__main__['\"]:",
]
