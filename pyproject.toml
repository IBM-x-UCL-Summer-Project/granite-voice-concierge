[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-voice-concierge"
version = "0.1.0"
description = "Offline voice-first assistant prototype for independent living"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "ollama>=0.6.2,<0.7",
    "pydantic>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voice_concierge.reasoning" = ["prompts/*/*.toml", "prompts/*/*.txt"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
]
filterwarnings = [
    "ignore:urllib3 v2 only supports OpenSSL:Warning",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == ['\"]__main__['\"]:",
]

pythonpath = ["src"]