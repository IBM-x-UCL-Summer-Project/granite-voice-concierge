services:
  voice-concierge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: granite-voice-concierge
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      # Persistent data
      - ./data/.local:/app/.local
      # Keep downloaded Whisper and other Hugging Face model files across
      # container recreation.
      - model-cache:/root/.cache
    environment:
      # Ollama runs natively on the host so macOS can use Metal acceleration.
      # The entrypoint also writes this URL to the reasoning model selection.
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - OLLAMA_HOST=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - REASONING_MODEL=${OLLAMA_MODEL:-granite4.1:8b}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - -m
      - voice_concierge.app.web
      - --host
      - 0.0.0.0
      - --port
      - "4173"
      - --voice-io
      - --log-level
      - DEBUG
      - --log-file
      - .local/logs/web.log
    # For live voice mode, uncomment below:
    # devices:
    #   - /dev/snd:/dev/snd
    #   - /dev/dsp:/dev/dsp

  # Optional: Web UI reverse proxy / api gateway
  # Uncomment if you need routing or SSL termination
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - voice-concierge

volumes:
  model-cache:
    driver: local

networks:
  default:
    name: granite-network
