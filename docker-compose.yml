services:
  voice-concierge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    container_name: granite-voice-concierge
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      # Persistent data
      - ./data/.local:/app/.local
      # Keep downloaded Whisper and other Hugging Face model files across
      # container recreation.
      - voice-model-cache:/home/app/.cache
    environment:
      # Ollama runs natively on macOS and Windows so it can use host GPU
      # acceleration without requiring GPU passthrough into Docker Desktop.
      # The entrypoint also writes this URL to the reasoning model selection.
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - OLLAMA_HOST=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - REASONING_MODEL=${OLLAMA_MODEL:-granite4.1:8b}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - python
      - -m
      - voice_concierge.app.web
      - --host
      - 0.0.0.0
      - --port
      - "4173"
      - --voice-io
      - --log-level
      - ${GVC_LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen("http://127.0.0.1:4173/api/health", timeout=3);
          raise SystemExit(0 if json.load(response).get("status") == "ready" else 1)
      interval: 15s
      timeout: 5s
      start_period: 5m
      retries: 8
    # Direct audio-device mappings are available only on native Linux. Docker
    # Desktop users capture and play audio through the local browser interface.
    # For native-Linux live voice mode, uncomment below:
    # devices:
    #   - /dev/snd:/dev/snd
    #   - /dev/dsp:/dev/dsp

  # Optional: Web UI reverse proxy / api gateway
  # Uncomment if you need routing or SSL termination
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - voice-concierge

volumes:
  voice-model-cache:
    driver: local

networks:
  default:
    name: granite-network
